name: Check Otya public surfaces

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/public-surface-smoke.yml'
      - '.github/CODEOWNERS'
      - 'README.md'
      - 'SECURITY.md'
      - 'BETA.md'
      - 'news/**'
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/public-surface-smoke.yml'
      - '.github/CODEOWNERS'
      - 'README.md'
      - 'SECURITY.md'
      - 'BETA.md'
      - 'news/**'
  schedule:
    - cron: '17 5 * * *'

permissions:
  contents: read

jobs:
  public-surfaces:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7

      - name: Check canonical public URLs
        shell: bash
        env:
          OTYA_PUBLIC_SURFACES_READY: ${{ vars.OTYA_PUBLIC_SURFACES_READY }}
        run: |
          set -euo pipefail
          if [[ "$OTYA_PUBLIC_SURFACES_READY" != "true" ]]; then
            echo "Live checks are disabled until the Otya domain migration is delegated and verified."
            exit 0
          fi
          urls=(
            "https://otya.site"
            "https://api.otya.site/health"
            "https://docs.otya.site"
            "https://status.otya.site"
            "https://space.otya.site"
            "https://otya.site/privacy"
            "https://otya.site/terms"
            "https://otya.site/download/otya-player"
          )

          for url in "${urls[@]}"; do
            echo "Checking $url"
            curl \
              --fail \
              --silent \
              --show-error \
              --location \
              --max-time 15 \
              --retry 1 \
              --output /dev/null \
              "$url"
          done

      - name: Check current public repository contract
        shell: bash
        run: |
          set -euo pipefail
          test -f postman/Otya-public.postman_collection.json
          test -f SECURITY.md
          test -f .github/CODEOWNERS
          grep -Fq 'security@otya.site' SECURITY.md
          grep -Fq '* @peterkatabira' .github/CODEOWNERS
          grep -Fq '[Security and vulnerability reporting](SECURITY.md)' README.md
          ! grep -Fq 'https://otya.site/docs' README.md
          ! grep -Fq 'Online Music behavior that is already supported' BETA.md

      - name: Check public JSON contracts
        shell: bash
        env:
          OTYA_PUBLIC_SURFACES_READY: ${{ vars.OTYA_PUBLIC_SURFACES_READY }}
        run: |
          set -euo pipefail
          if [[ "$OTYA_PUBLIC_SURFACES_READY" != "true" ]]; then
            echo "Skipping live API checks until the Otya domain migration is verified."
            exit 0
          fi
          for url in \
            "https://api.otya.site/latest" \
            "https://api.otya.site/api/version"
          do
            echo "Checking $url"
            curl \
              --fail \
              --silent \
              --show-error \
              --location \
              --max-time 15 \
              --retry 1 \
              --output /tmp/otya-public.json \
              "$url"
            python3 -m json.tool /tmp/otya-public.json >/dev/null
          done

      - name: Check public authentication protection
        shell: bash
        env:
          OTYA_PUBLIC_SURFACES_READY: ${{ vars.OTYA_PUBLIC_SURFACES_READY }}
        run: |
          set -euo pipefail
          if [[ "$OTYA_PUBLIC_SURFACES_READY" != "true" ]]; then
            echo "Skipping live Turnstile smoke check until the Otya domain migration is verified."
            exit 0
          fi
          curl \
            --fail \
            --silent \
            --show-error \
            --location \
            --max-time 15 \
            --retry 1 \
            --output /tmp/otya-turnstile.json \
            "https://api.otya.site/api/security/turnstile/config"
          python3 - <<'PY'
          import json
          from pathlib import Path

          data = json.loads(Path('/tmp/otya-turnstile.json').read_text())
          if data.get('turnstile') is not True:
              raise SystemExit('Turnstile is not enabled on the public authentication surface')
          if not str(data.get('siteKey') or '').strip():
              raise SystemExit('Turnstile public site key is unavailable')
          print('Turnstile public authentication protection is available')
          PY
